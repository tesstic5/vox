# Starter Prometheus scrape config for the Dokploy Compose network.
# Keep /api/metrics private: it carries aggregate operations data, not patient or
# workspace detail, but there is no reason to publish it on the internet.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: voxera
    static_configs:
      - targets: ['app:3000']
    metrics_path: /api/metrics
